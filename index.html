let overlapFlags=audienceOverlap.filter(o=>overlapPct(o)>settings.overlapThreshold);
add('P06','Cross-channel audience overlap','Strategic fit','Medium',overlapFlags.length?'Flag':'Pass',`${audienceOverlap.length} simulated channel-pair reach comparisons tested. ${overlapFlags.length} exceed ${pct(settings.overlapThreshold)} shared reach / smaller channel reach. Highest: ${pct(Math.max(0,...audienceOverlap.map(overlapPct)))}. These are fabricated reach-study estimates, not actual deduplicated platform measurements.`, 'Request validated audience overlap, exposure duplication and frequency studies before changing allocations.',['Can you provide a deduplicated cross-channel reach report and frequency distribution?','Are audiences intentionally retargeted across these channels?']);
add('P07','Forecast conversion assumptions','Measurement','Medium','Need evidence','Conversion rate reasonableness cannot be established from projections alone.','Compare planned rates with category and brand historical performance.',['What historical results support the planned conversion rates?']);
let share=ch.length?Math.max(...ch.map(x=>x.plan))/Math.max(1,b):0;
add('P08','Channel concentration','Strategic fit','Medium',share>.4?'Flag':'Pass',`Largest channel represents ${pct(share)} of planned budget; provisional review threshold is 40%.`,'Document rationale for any high concentration.',['What is the rationale for the channel mix?']);
let ctv=plan.filter(r=>/CTV/i.test(r.Channel||''));
add('P09','CTV reach and frequency measurement','Measurement','High',!ctv.length?'Not applicable':settings.reachTargets?'Pass':'Flag',ctv.length?`CTV has ${money(sum(ctv,'Net Media Budget'))} planned; numerical reach/frequency targets are ${settings.reachTargets?'marked documented':'not supplied'}.`:'No CTV rows.','Obtain numerical reach, frequency, and lift measurement plan.',['What are planned unique reach, average frequency, and measurement methodology?'],ctv.map(r=>r['Line ID']));
add('P10','Allowable customer acquisition cost','Financial integrity','Medium',n(settings.marginTarget)>0?(divide(t.cost,t.gconv)>n(settings.marginTarget)?'Flag':'Pass'):'Need evidence',n(settings.marginTarget)>0?`GA4-attributed blended CPA ${money(divide(t.cost,t.gconv))} vs maximum allowable ${money(settings.marginTarget)}; attribution limitations apply.`:'Profitability / maximum allowable CAC not supplied.','Provide allowable CAC and contribution margin, then verify attribution.',['What is the maximum sustainable customer acquisition cost?']);
let over=actual.filter(r=>n(r['Agency Spend Variance %'])>settings.overspendThreshold);
let under=actual.filter(r=>n(r['Agency Spend Variance %'])< -settings.overspendThreshold);
let outliers=[...over,...under];
add('A01','Line-item spend variance (±10%)','Delivery','High',outliers.length?'Flag':'Pass',`${over.length} line items overspent and ${under.length} underspent by more than ${pct(settings.overspendThreshold)} versus their own planned spend.`, 'Verify both unauthorized overspends and meaningful underdelivery against amendments and invoices.',['Which budget changes, underspends, and reallocations were approved?'],outliers.map(r=>r['Line ID']));
let totalVariance=divide(t.cost,n(settings.approvedBudget))-1;
add('A02','Total media budget variance (±10%)','Delivery','High',Math.abs(totalVariance)>settings.overspendThreshold?'Flag':'Pass',`Actual media spend ${money(t.cost)} against approved ${money(settings.approvedBudget)} (${totalVariance>=0?'+':''}${pct(totalVariance)}); review threshold is ±${pct(settings.overspendThreshold)}.`, 'Verify material overdelivery or underdelivery, and avoid treating a smaller variance as contractual approval.',['Were total media budget variances approved?']);
let gaps=actual.filter(r=>n(r['Agency Reported Conversions'])>0&&divide(n(r['Agency Reported Conversions'])-n(r['GA4 Key Events / Purchases']),n(r['Agency Reported Conversions']))>n(settings.conversionGapThreshold));
add('A03','Agency-reported vs GA4 conversions','Attribution','High',gaps.length?'Flag':'Pass',`${gaps.length} tactics show conversion gaps above ${pct(settings.conversionGapThreshold)}. Overall agency ${fmt(t.conv)} vs GA4 ${fmt(t.gconv)} (${fmt(t.gap)} difference). Shown side-by-side for investigation; differing attribution methods can legitimately yield different totals.`,'Check attribution windows, conversion definitions, consent, cross-device tracking, and event duplication.',['Are the conversion events and attribution windows consistent between GA4 and the platforms?','Are platform-reported conversions deduplicated?'],gaps.map(r=>r['Line ID']));
let lower=actual.filter(r=>n(r['GA4 Attributed Revenue'])<n(r['Agency Reported Revenue'])*.8);
add('A04','Revenue attribution gap','Attribution','High',lower.length?'Flag':'Pass',`${lower.length} tactics have GA4-attributed revenue at least 20% below agency-reported revenue. Totals: ${money(t.revenue)} agency vs ${money(t.grevenue||t.grevenue)} GA4.`.replace('NaN',''), 'Reconcile transaction IDs, conversion values and attribution methodology.',['What explains the revenue reporting difference by tactic?'],lower.map(r=>r['Line ID']));
let weak=actual.filter(r=>n(r['Agency Reported Revenue'])/Math.max(1,n(r['Agency Actual Net Spend'])) < n(r['Planned Net Spend'])?false:false);
let performance=actual.filter(r=>{let p=plan.find(p=>p['Line ID']===r['Line ID']);return p&&n(p.ROAS)>0&&divide(n(r['Agency Reported Revenue']),n(r['Agency Actual Net Spend']))<n(p.ROAS)*.8});
add('A05','ROAS under plan','Performance','Medium',performance.length?'Flag':'Pass',`${performance.length} tactics deliver agency-reported ROAS more than 20% below plan; this is a review threshold, not proof of mismanagement.`,'Review channel objectives, performance changes, creative, and auction costs.',['Why did ROAS fall below the plan, and which corrective actions were taken?'],performance.map(r=>r['Line ID']));
add('A06','Attribution documentation','Attribution','Medium',settings.attributionDocumented?'Pass':'Need evidence','Source/medium labels and aggregated GA4-style numbers are present, but underlying attribution models and reconciled exports are not documented.','Provide event definitions, attribution windows, source exports and reconciliation notes.',['Which GA4 attribution model and conversion events are used?']);
return out;}
function auditSafe(){return audit().map(r=>({...r,evidence:r.evidence.replace(/\$NaN/g,'N/A')}));}
function badge(v){let cl=v==='Pass'?'pass':v==='Flag'?'flag':v==='Need evidence'?'need':'na';return `<span class="status ${cl}">${esc(v)}</span>`;}
function stat(label,v,caption,color=''){return `<div class="card stat ${color}"><div class="label">${esc(label)}</div><div class="num">${v}</div><small>${caption}</small></div>`}
function header(t,d,actions=''){return `<div class="header"><div><h1 class="title">${esc(t)}</h1><p class="sub">${d}</p></div><div class="actions no-print">${actions}</div></div>`}
function btn(id,label='Download CSV'){return `<button class="btn small" id="${id}">↓ ${label}</button>`}
function summary(){let t=sums(actual),pConv=sum(plan,'Planned Conversions'),pRev=sum(plan,'Planned Revenue');return `<div class="stats">${stat('Actual media spend',money(t.cost),`${money(t.plan)} planned · ${pct(divide(t.cost,t.plan)-1)} variance`,'blue')}${stat('Agency-reported ROAS',ratio(divide(t.revenue,t.cost)),`${ratio(divide(pRev,t.plan))} planned`)}${stat('GA4-attributed ROAS',ratio(divide(t.grevenue||t.grevenue,t.cost)),`GA4-attributed revenue ÷ spend`,'green')}${stat('Agency vs GA4 conversions',fmt(t.gap),`${fmt(t.conv)} agency · ${fmt(t.gconv)} GA4`)}</div>`.replace(/NaN/g,'N/A');}
function compareTable(){let t=sums(actual),p={spend:sum(plan,'Net Media Budget'),impr:sum(plan,'Planned Impressions'),click:sum(plan,'Planned Clicks'),conv:sum(plan,'Planned Conversions'),rev:sum(plan,'Planned Revenue')};let rows=[['Media spend',money(p.spend),money(t.cost),'Not available'],['Impressions',fmt(p.impr),fmt(t.impressions),'Not available'],['Clicks',fmt(p.click),fmt(t.click),'Not available'],['Conversions',fmt(p.conv),fmt(t.conv),fmt(t.gconv)],['Revenue',money(p.rev),money(t.revenue),money(t.grevenue||t.grevenue)],['ROAS',ratio(divide(p.rev,p.spend)),ratio(divide(t.revenue,t.cost)),ratio(divide(t.grevenue||t.grevenue,t.cost))],['CPA',money(divide(p.spend,p.conv)),money(divide(t.cost,t.conv)),money(divide(t.cost,t.gconv))]];return `<div class="comparison"><div class="head">Metric</div><div class="head">Plan</div><div class="head">Agency reported</div><div class="head">GA4-attributed</div>${rows.map((x,i)=>x.map(v=>`<div class="${i===rows.length-1?'end':''}">${esc(v)}</div>`).join('')).join('')}</div>`;}
function barChart(){let ch=channelRows(),max=Math.max(...ch.map(x=>x.cost));return ch.map((c,i)=>`<div class="barrow" style="grid-template-columns:145px 1fr 80px"><span>${esc(c.name)}</span><div class="bar"><div style="width:${100*c.cost/max}%;background:${colors[i%colors.length]}"></div></div><b style="text-align:right">${money(c.cost)}</b></div>`).join('')}
function topFindings(){return auditSafe().filter(r=>r.status==='Flag').slice(0,4).map(r=>`<button class="finding" data-detail="${r.id}"><span class="status flag">${r.severity}</span><h3>${esc(r.title)}</h3><p>${esc(r.evidence)}</p></button>`).join('')}
function dashboard(){let t=sums(actual),a=auditSafe(),flag=a.filter(r=>r.status==='Flag').length;return header('Performance Audit Overview','Fictional FY2027 · $1M media plan + agency-reported results + GA4-style attribution',`${btn('exportResults','Export results')}<button class="btn primary" data-nav="results">Explore results →</button>`)+summary()+feePanel()+`<section class="card section sectiongap"><div class="row" style="display:flex;align-items:center;justify-content:space-between"><h2 class="sectitle">Audience overlap evidence</h2><button class="btn small" data-nav="overlap">View channel pairs →</button></div><p class="smallmuted">Flag threshold: ${pct(settings.overlapThreshold)}; ${audienceOverlap.filter(o=>overlapPct(o)>settings.overlapThreshold).length} of ${audienceOverlap.length} modeled pairs require review. Reach figures are fictional.</p></section>`+`<div class="triple"><section class="card section"><h2 class="sectitle">Audit status</h2><div class="rows">${[['Rules tested',a.length],['Flagged for review',flag],['Passed',a.filter(x=>x.status==='Pass').length],['Require evidence',a.filter(x=>x.status==='Need evidence').length],['Campaign line items',actual.length],['Advertising channels',uniq(actual,'Channel').length]].map(x=>`<div class="kv"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div></section><section class="card section"><h2 class="sectitle">Spend by channel</h2>${barChart()}</section><section class="card section"><h2 class="sectitle">Attribution differences</h2><div class="metricbox"><div class="smallmuted">Reported conversion gap</div><div class="big">${pct(divide(t.gap,t.conv))}</div><div class="smallmuted">${fmt(t.gap)} agency conversions not represented in GA4-attributed counts</div></div><div style="height:10px"></div><div class="metricbox"><div class="smallmuted">Revenue attribution gap</div><div class="big">${money(t.revenue-t.grevenue)}</div><div class="smallmuted">Not proof of reporting error — models may differ.</div></div></section></div><section class="card section sectiongap"><h2 class="sectitle">Plan vs. actual vs. GA4</h2>${compareTable()}</section><section class="card section sectiongap"><h2 class="sectitle">Priority audit findings <button class="btn small" data-nav="findings">All findings →</button></h2><div class="findings">${topFindings()}</div></section><div class="note note-warn sectiongap">SIMULATED DATA · GA4 figures are fictional aggregate attributions, not a GA4 export or a live integration. GA4 does not provide media spend for all channels in this sample. Agency and GA4 conversions can differ legitimately based on attribution settings.</div>`;}
function results(){let options=['All channels',...uniq(actual,'Channel')],rows=actual.filter(x=>channel==='All channels'||x.Channel===channel).filter(x=>(x['Line ID']+' '+x.Channel+' '+x['Placement / Tactic']).toLowerCase().includes(search.toLowerCase()));let totals=sums(rows);return header('Delivery results & GA4','Inspect all 15 fictional placements, with planned, agency, and GA4-attributed numbers.',`${btn('exportResults','Export results CSV')}`)+`<div class="toolbar"><div class="actions"><select class="search" id="channelSelect" aria-label="Channel">${options.map(x=>`<option ${x===channel?'selected':''}>${esc(x)}</option>`).join('')}</select><input id="search" class="search" placeholder="Find channel, placement or line ID" value="${esc(search)}"></div><div class="smallmuted">${rows.length} tactics · ${money(totals.cost)} spend</div></div><section class="card section"><h2 class="sectitle">Channel performance comparison</h2><div class="tablewrap"><table><thead><tr><th>Channel</th><th>Planned spend</th><th>Actual spend</th><th>Variance</th><th>Agency conversions</th><th>GA4 conversions</th><th>Agency ROAS</th><th>GA4 ROAS</th></tr></thead><tbody>${channelRows().filter(c=>channel==='All channels'||c.name===channel).map(c=>`<tr class="pointer" data-channel="${esc(c.name)}"><td><strong>${esc(c.name)}</strong></td><td>${money(c.plan)}</td><td>${money(c.cost)}</td><td class="${c.cost>c.plan?'bad':'good'}">${pct(divide(c.cost,c.plan)-1)}</td><td>${fmt(c.conv)}</td><td>${fmt(c.gconv)}</td><td>${ratio(divide(c.revenue,c.cost))}</td><td>${ratio(divide(c.grevenue||c.grevenue,c.cost))}</td></tr>`).join('')}</tbody></table></div></section><section class="card section sectiongap"><h2 class="sectitle">Placement-level results</h2><div class="tablewrap"><table><thead><tr><th>ID</th><th>Tactic / channel</th><th>Plan</th><th>Actual</th><th>Variance</th><th>Agency conv.</th><th>GA4 conv.</th><th>Conv. gap</th><th>Agency revenue</th><th>GA4 revenue</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r['Line ID'])}</td><td><strong>${esc(r['Placement / Tactic'])}</strong><div class="tiny">${esc(r.Channel)}</div></td><td>${money(r['Planned Net Spend'])}</td><td>${money(r['Agency Actual Net Spend'])}</td><td class="${n(r['Agency Spend Variance $'])>0?'bad':'good'}">${pct(r['Agency Spend Variance %'])}</td><td>${fmt(r['Agency Reported Conversions'])}</td><td>${fmt(r['GA4 Key Events / Purchases'])}</td><td class="${n(r['Conversion Gap %'])>.15?'bad':''}">${pct(r['Conversion Gap %'])}</td><td>${money(r['Agency Reported Revenue'])}</td><td>${money(r['GA4 Attributed Revenue'])}</td><td><button class="link" data-line="${esc(r['Line ID'])}">Details →</button></td></tr>`).join('')}</tbody></table></div><div class="scroll-hint">Scroll horizontally to view all fields on smaller screens.</div></section>`;}
function planPage(){return header('Original media plan','Source assumptions and forecast KPIs retained alongside the simulation.',`${btn('exportPlan','Export plan CSV')}`)+`<section class="card section"><div class="tablewrap"><table><thead><tr><th>ID</th><th>Channel</th><th>Placement</th><th>Objective</th><th>Primary KPI</th><th>Media budget</th><th>Planned conv.</th><th>Projected revenue</th><th>Projected ROAS</th></tr></thead><tbody>${plan.map(r=>`<tr><td>${esc(r['Line ID'])}</td><td>${esc(r.Channel)}</td><td>${esc(r['Placement / Tactic'])}</td><td>${esc(r['Primary Objective'])}</td><td>${esc(r['Primary KPI'])}</td><td>${money(r['Net Media Budget'])}</td><td>${fmt(r['Planned Conversions'])}</td><td>${money(r['Planned Revenue'])}</td><td>${ratio(r.ROAS)}</td></tr>`).join('')}</tbody></table></div></section>`}
function ruleTable(items){return `<div class="tablewrap"><table><thead><tr><th>Rule</th><th>Category</th><th>Priority</th><th>Status</th><th>Evidence</th><th>Details</th></tr></thead><tbody>${items.map(r=>`<tr><td><strong>${esc(r.id)} · ${esc(r.title)}</strong></td><td>${esc(r.group)}</td><td>${esc(r.severity)}</td><td>${badge(r.status)}</td><td>${esc(r.evidence)}</td><td><button class="link" data-detail="${r.id}">Inspect →</button></td></tr>`).join('')}</tbody></table></div>`}
function benchmarkPage(){let flagged=pricingEvidence.filter(x=>x.status==='Above directional range');return header('Media Pricing Benchmarks','Published market references · directional screening, not proof of waste',`${btn('exportBenchmarks','Export pricing evidence')}`)+`<section class="card section"><h2 class="sectitle">Benchmark evidence register</h2><p class="smallmuted">WordStream 2026 paid search CPC and Solomon Partners 2025 CPM categories. Product, objective, inventory, geography, measurement and year materially affect comparability.</p><div class="tablewrap"><table><thead><tr><th>Channel</th><th>Metric</th><th>Low</th><th>High</th><th>Source</th><th>Limitations</th></tr></thead><tbody>${benchmarks.map(b=>`<tr><td>${esc(b.channel)}</td><td>${esc(b.unit)}</td><td>${moneyDecimal(b.low)}</td><td>${moneyDecimal(b.high)}</td><td><a href="${esc(b.url)}" target="_blank" rel="noopener">${esc(b.source)} ${esc(b.year)} ↗</a></td><td>${esc(b.caveat)}</td></tr>`).join('')}</tbody></table></div></section><section class="card section sectiongap"><h2 class="sectitle">15-placement pricing assessment</h2><p class="smallmuted">${flagged.length} placements screen above a broad published reference by more than 20%; this does not establish excess spend. Channels without a defensible comparable are labeled accordingly.</p><div class="tablewrap"><table><thead><tr><th>ID</th><th>Channel / placement</th><th>Actual rate</th><th>Reference range</th><th>Screening status</th></tr></thead><tbody>${pricingEvidence.map(r=>`<tr><td>${esc(r.id)}</td><td><b>${esc(r.channel)}</b><div class="tiny">${esc(r.tactic)}</div></td><td>${r.rate===null?'—':moneyDecimal(r.rate)+' '+esc(r.unit)}</td><td>${r.low===null?'No direct comparable':moneyDecimal(r.low)+'–'+moneyDecimal(r.high)+' '+esc(r.unit)}</td><td><span class="status ${r.status==='Above directional range'?'flag':r.status==='Within/near directional range'?'pass':'need'}">${esc(r.status)}</span></td></tr>`).join('')}</tbody></table></div></section><div class="note note-warn sectiongap">Sources are public industry references, not matched bids, invoices, or verified fair-market rates. Avoid converting differences into savings without proving inventory equivalence.</div>`;}
const moneyDecimal=v=>'$'+Number(v).toFixed(2);
function feePanel(){let x=sums(actual),rate=settings.agencyFeeRate,plannedFee=sum(plan,'Agency Fee'),actualFee=x.cost*rate,total=x.cost+actualFee;return `<section class="card section sectiongap"><h2 class="sectitle">Agency fees and fully loaded investment</h2><div class="planactual"><div class="metricbox"><div class="smallmuted">Agency fee rate</div><div class="big">${pct(rate)}</div><div class="smallmuted">Fictional contractual assumption</div></div><div class="metricbox"><div class="smallmuted">Planned agency fee</div><div class="big">${money(plannedFee)}</div><div class="smallmuted">Budget plus fee: ${money(sum(plan,'Net Media Budget')+plannedFee)}</div></div><div class="metricbox"><div class="smallmuted">Actual agency fee</div><div class="big">${money(actualFee)}</div><div class="smallmuted">Fully loaded spend: ${money(total)}</div></div></div><div class="planactual" style="margin-top:12px"><div class="metricbox"><div class="smallmuted">Agency media-only ROAS</div><div class="big">${ratio(divide(x.revenue,x.cost))}</div></div><div class="metricbox"><div class="smallmuted">Agency fully loaded ROAS</div><div class="big">${ratio(divide(x.revenue,total))}</div></div><div class="metricbox"><div class="smallmuted">GA4 fully loaded ROAS</div><div class="big">${ratio(divide(x.grevenue,total))}</div></div></div><p class="smallmuted">The 15% fee is applied to net media spend; invoices and embedded platform costs are still unverified.</p></section>`;}
function overlapPage(){let fs=audienceOverlap.filter(o=>overlapPct(o)>settings.overlapThreshold);return header('Audience overlap analysis','Fictional reach study · channel pairs and their shared audiences',`<button class="btn" data-nav="settings">Review thresholds →</button>`)+`<div class="triple"><section class="card section"><div class="smallmuted">Overlap flag threshold</div><div class="big">${pct(settings.overlapThreshold)}</div></section><section class="card section"><div class="smallmuted">Channel pairs analyzed</div><div class="big">${audienceOverlap.length}</div></section><section class="card section"><div class="smallmuted">Pairs above threshold</div><div class="big">${fs.length}</div></section></div><section class="card section sectiongap"><h2 class="sectitle">Modeled channel-pair reach comparison</h2><p class="smallmuted">Overlap = estimated shared users ÷ smaller channel's unique audience. This measures pairwise duplication, not wasted spend or a combined unique reach calculation.</p><div class="tablewrap"><table><thead><tr><th>Channel pair</th><th>Reach A</th><th>Reach B</th><th>Shared reach</th><th>Overlap</th><th>Result</th></tr></thead><tbody>${audienceOverlap.map(o=>`<tr><td><b>${esc(o.a)}</b> + ${esc(o.b)}</td><td>${fmt(o.reachA)}</td><td>${fmt(o.reachB)}</td><td>${fmt(o.shared)}</td><td><b>${pct(overlapPct(o))}</b></td><td>${badge(overlapPct(o)>settings.overlapThreshold?'Flag':'Pass')}</td></tr>`).join('')}</tbody></table></div></section><div class="note note-warn sectiongap">These overlap figures are invented solely for this demonstration. A real audit must establish common user identity, matched geography and campaign period, and measurement uncertainty before drawing conclusions.</div>`;}
function rules(){let a=auditSafe();return header('Transparent audit rules','10 plan checks + 6 delivery / attribution checks. Thresholds can be adjusted in Audit Setup.',`<button class="btn" data-nav="settings">⚙ Review assumptions</button>`)+`<div class="toolbar"><div class="filters">${['all','Pass','Flag','Need evidence'].map(s=>`<button data-filter="${s}" class="${filter===s?'sel':''}">${s==='all'?'All':' '+s}</button>`).join('')}</div><span class="smallmuted">${a.length} rules · evidence first</span></div><section class="card section">${ruleTable(a.filter(r=>filter==='all'||r.status===filter))}</section>`}
function findings(){let a=auditSafe().filter(r=>r.status==='Flag'||r.status==='Need evidence').filter(r=>filter==='all'||r.status===filter);return header('Findings & investigations','A flag is a reason to investigate, not proof of agency wrongdoing.',`<button class="btn primary" data-nav="qa">Agency questions →</button>`)+`<div class="toolbar"><div class="filters">${['all','Flag','Need evidence'].map(s=>`<button data-filter="${s}" class="${filter===s?'sel':''}">${s==='all'?'All findings':s}</button>`).join('')}</div></div><div class="stack">${a.map(r=>`<section class="card section"><div class="row" style="display:flex;align-items:center;justify-content:space-between;gap:10px"><h2 class="sectitle" style="margin:0">${esc(r.title)}</h2>${badge(r.status)}</div><p class="sub" style="margin:12px 0">${esc(r.evidence)}</p><div class="smallmuted">${r.lines.length?'Affected IDs: '+esc(r.lines.join(', ')):'Cross-plan review'}</div><div style="margin-top:13px"><button class="btn small" data-detail="${r.id}">View evidence and action →</button></div></section>`).join('')}</div>`;}
function questions(){return auditSafe().filter(x=>x.status==='Flag'||x.status==='Need evidence').flatMap(r=>r.qs.map((q,i)=>({key:r.id+'-'+i,r,q})));}
function qa(){let qs=questions();return header('Questions for the agency','Generated from open audit findings. Record responses locally in this session.',`${btn('exportQuestions','Export questions')}`)+`<section class="card section"><p class="smallmuted">${qs.length} questions generated · Nothing is sent to an agency automatically.</p>${qs.map((o,i)=>`<div class="qrow"><div><strong>${i+1}. ${esc(o.q)}</strong><p>${esc(o.r.title)}</p><textarea data-response="${o.key}" class="search" style="width:100%;height:75px;resize:vertical" placeholder="Record response or supporting evidence...">${esc(responses[o.key]||'')}</textarea></div><span>${badge(o.r.status)}</span></div>`).join('')}</section>`}
function report(){let t=sums(actual),a=auditSafe(),flags=a.filter(r=>r.status==='Flag');return `<div class="report">${header('Independent Media Audit Report','Fictional performance audit · FY2027',`<button class="btn" id="printReport">⎙ Print / Save PDF</button>${btn('exportRules','Export findings')}`)}<section class="card section"><div class="eyebrow">EXECUTIVE SUMMARY</div><h2>Advertising investment and reported outcomes</h2><p class="sub">Campaign spend of ${money(t.cost)} exceeded the ${money(settings.approvedBudget)} approved sample budget by ${money(t.cost-n(settings.approvedBudget))}. Agency-reported revenue was ${money(t.revenue)}, compared with ${money(t.grevenue)} in GA4-style attributed revenue. The gap requires reconciliation and does not establish a reporting error.</p><div class="sectiongap">${compareTable()}</div></section>${feePanel()}<section class="card section sectiongap"><h2>Priority findings</h2>${flags.map(r=>`<div class="block"><strong>${esc(r.id)} — ${esc(r.title)}</strong> ${badge(r.status)}<p class="smallmuted">${esc(r.evidence)}</p><p class="smallmuted"><strong>Next action:</strong> ${esc(r.action)}</p></div>`).join('')}</section><section class="card section sectiongap"><h2>Methodology and limitations</h2><p class="sub">Rule-based plan validation with provisional thresholds for overspending, attribution discrepancies and ROAS variances. All figures are fictional. GA4 values are simulated attributed purchases and revenue; there is no real GA4 integration, no validated media market benchmark, and no conclusive incrementality test. Findings require review of source exports and contracts.</p></section></div>`;}
function settingsPage(){return header('Audit setup','Adjust review thresholds and document supplied business context. Changes rerun rules instantly.')+`<section class="card section" style="max-width:800px"><form id="settingsForm" class="contextform"><div class="field full"><label>Advertiser</label><input name="brand" value="${esc(settings.brand)}"></div><div class="field"><label>Approved media budget ($)</label><input type="number" min="0" name="approvedBudget" value="${settings.approvedBudget}"></div><div class="field"><label>Allowable customer acquisition cost ($, optional)</label><input type="number" min="0" name="marginTarget" value="${settings.marginTarget}"></div><div class="field"><label>Line-item & total spend variance threshold, either direction (%)</label><input type="number" min="0" max="100" step="1" name="overspendThreshold" value="${settings.overspendThreshold*100}"></div><div class="field"><label>Audience overlap flag threshold (%)</label><input type="number" min="0" max="100" step="1" name="overlapThreshold" value="${settings.overlapThreshold*100}"></div><div class="field"><label>Agency / GA4 conversion gap threshold (%)</label><input type="number" min="0" max="100" step="1" name="conversionGapThreshold" value="${settings.conversionGapThreshold*100}"></div>${[['reachTargets','CTV reach and frequency targets supplied'],['attributionDocumented','Attribution documentation supplied']].map(([k,l])=>`<div class="field full"><label><input type="checkbox" name="${k}" ${settings[k]?'checked':''} style="width:auto;margin-right:9px">${l}</label></div>`).join('')}<div class="field full"><button class="btn primary" type="submit">Apply assumptions and rerun rules</button></div></form></section><div class="note sectiongap">Documented checkboxes are assertions supplied for the prototype; they do not independently verify evidence.</div>`}
function drawer(html){$('#drawer').innerHTML=`<div class="drawerhead"><span class="tiny">AUDIT INSPECTOR</span><button class="close" id="closeDrawer">×</button></div>${html}`;$('#drawerbg').classList.add('show');$('#closeDrawer').onclick=()=>$('#drawerbg').classList.remove('show');}
function detail(id){let r=auditSafe().find(x=>x.id===id);if(!r)return;drawer(`<h2 style="font-size:23px;margin:23px 0 10px">${esc(r.title)}</h2>${badge(r.status)} <span class="pill demo">${esc(r.severity)} priority</span><div class="block"><h4>What the rule found</h4><p>${esc(r.evidence)}</p></div><div class="block"><h4>Related line IDs</h4><p>${r.lines.length?esc(r.lines.join(', ')):'Plan-wide / documentation review'}</p></div><div class="block"><h4>Recommended action</h4><p>${esc(r.action)}</p></div><div class="block"><h4>Questions for the agency</h4><ol>${r.qs.map(q=>`<li>${esc(q)}</li>`).join('')}</ol></div><p class="smallmuted">Provisional audit logic. Human review is required before drawing conclusions.</p>`)}
function lineDetail(id){let r=actual.find(x=>x['Line ID']===id),p=plan.find(x=>x['Line ID']===id);if(!r)return;drawer(`<h2 style="margin-top:24px">${esc(id)} · ${esc(r['Placement / Tactic'])}</h2><p class="sub">${esc(r.Channel)} · ${esc(r['Platform / Vendor'])}</p><div class="block"><h4>Media spend</h4><p>Plan ${money(r['Planned Net Spend'])} · Actual ${money(r['Agency Actual Net Spend'])} · Variance ${pct(r['Agency Spend Variance %'])}</p></div><div class="block"><h4>Performance</h4><p>Agency conversions: ${fmt(r['Agency Reported Conversions'])}</p><p>GA4-attributed purchases: ${fmt(r['GA4 Key Events / Purchases'])}</p><p>Conversion discrepancy: ${pct(r['Conversion Gap %'])}</p><p>Agency revenue: ${money(r['Agency Reported Revenue'])}</p><p>GA4-attributed revenue: ${money(r['GA4 Attributed Revenue'])}</p><p>Planned ROAS: ${ratio(p?.ROAS)} · Agency ROAS: ${ratio(r['Agency ROAS'])} · GA4 ROAS: ${ratio(r['GA4 ROAS (on agency spend)'])}</p></div><div class="block"><h4>Source / medium</h4><p>${esc(r['GA4 Source / Medium'])}</p></div><div class="block"><h4>Simulation note</h4><p>${esc(r['Audit Note'])}</p></div>`)}
function csv(matrix){return matrix.map(row=>row.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',')).join('\r\n')}
function save(name,content,type='text/csv;charset=utf-8'){let a=document.createElement('a'),u=URL.createObjectURL(new Blob(['\ufeff',content],{type}));a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function exportObjs(name,rows){let fields=[...new Set(rows.flatMap(x=>Object.keys(x)))];save(name,csv([fields,...rows.map(x=>fields.map(k=>x[k]))]));}
function bind(){ $$('[data-nav]').forEach(e=>e.onclick=()=>{page=e.dataset.nav;filter='all';search='';render();window.scrollTo(0,0)});$$('[data-detail]').forEach(e=>e.onclick=()=>detail(e.dataset.detail));$$('[data-line]').forEach(e=>e.onclick=()=>lineDetail(e.dataset.line));$$('[data-filter]').forEach(e=>e.onclick=()=>{filter=e.dataset.filter;render()});$$('[data-channel]').forEach(e=>e.onclick=()=>{channel=e.dataset.channel;page='results';render()});let sel=$('#channelSelect');if(sel)sel.onchange=()=>{channel=sel.value;render()};let inp=$('#search');if(inp)inp.oninput=()=>{let v=inp.value,from=inp.selectionStart;search=v;render();let next=$('#search');next?.focus();next?.setSelectionRange(from,from)};$$('[data-response]').forEach(e=>e.oninput=()=>responses[e.dataset.response]=e.value);if($('#settingsForm'))$('#settingsForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);settings.brand=String(f.get('brand')||settings.brand);settings.approvedBudget=n(f.get('approvedBudget'));settings.marginTarget=n(f.get('marginTarget'));settings.overspendThreshold=n(f.get('overspendThreshold'))/100;settings.overlapThreshold=n(f.get('overlapThreshold'))/100;settings.conversionGapThreshold=n(f.get('conversionGapThreshold'))/100;['feeDocumented','reachTargets','attributionDocumented'].forEach(k=>settings[k]=f.has(k));page='dashboard';render()};if($('#exportResults'))$('#exportResults').onclick=()=>exportObjs('fictional_media_results.csv',actual);if($('#exportBenchmarks'))$('#exportBenchmarks').onclick=()=>exportObjs('pricing_evidence.csv',pricingEvidence);if($('#exportPlan'))$('#exportPlan').onclick=()=>exportObjs('original_media_plan.csv',plan);if($('#exportRules'))$('#exportRules').onclick=()=>exportObjs('audit_findings.csv',auditSafe());if($('#exportQuestions'))$('#exportQuestions').onclick=()=>exportObjs('agency_questions.csv',questions().map(x=>({rule:x.r.title,question:x.q,response:responses[x.key]||''})));if($('#printReport'))$('#printReport').onclick=()=>window.print();}
function render(){let views={dashboard,results,plan:planPage,benchmarks:benchmarkPage,overlap:overlapPage,rules,findings,qa,report,settings:settingsPage};$('#nav').innerHTML=navs.map(([id,s,name])=>`<button data-nav="${id}" class="${page===id?'active':''}"><span class="symbol">${s}</span>${esc(name)}</button>`).join('');$('#topClient').textContent=settings.brand;$('#app').innerHTML=views[page]();bind()}
$('#contextTop').onclick=()=>{page='settings';render()};$('#drawerbg').onclick=e=>{if(e.target.id==='drawerbg')$('#drawerbg').classList.remove('show')};document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#drawerbg').classList.remove('show')});render();
</script></body></html>
